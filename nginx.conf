worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;

  server {
    listen 3000;
    server_name _;

    # Serve /_next/static/ files directly from filesystem
    location /_next/static/ {
      alias /app/standalone/.next/static/;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header Accept-Ranges bytes always;
      try_files $uri =404;
    }

    # Serve public files (favicon, images, etc.)
    location ~ ^/(favicon\.ico|file\.svg|globe\.svg|next\.svg|vercel\.svg|window\.svg) {
      alias /app/standalone/public/;
      try_files $uri =404;
    }

    # Proxy everything else to Next.js
    location / {
      proxy_pass http://127.0.0.1:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
