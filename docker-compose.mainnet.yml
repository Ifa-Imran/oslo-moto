services:
  app:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "
        apk add --no-cache git tar &&
        if [ ! -f /app/.deployed-v26 ]; then
          rm -rf /tmp/repo /app/standalone /app/.deployed-* &&
          git clone --depth 1 --branch master https://github.com/Ifa-Imran/oslo-moto.git /tmp/repo &&
          tar xzf /tmp/repo/standalone-build.tar.gz -C /app &&
          rm -rf /tmp/repo &&
          touch /app/.deployed-v26 ;
        fi &&
        NODE_ENV=production HOSTNAME=0.0.0.0 PORT=3000 node /app/standalone/static-proxy.js
      "
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_WC_PROJECT_ID=de1938e67e453d4ff13d1689f2262e43
      - NEXT_PUBLIC_APP_URL=https://oslomoto.com
      - NEXT_PUBLIC_CHAIN_ID=56
      - NEXT_PUBLIC_USDT_ADDRESS=0x55d398326f99059fF775485246999027B3197955
      - NEXT_PUBLIC_OSLO_TOKEN_ADDRESS=0xCAACC067BD389597BD95A762436Feb723616Cab3
      - NEXT_PUBLIC_OSLO_DEX_ADDRESS=0x03bD43d3268BC584aDcB142a0fBAeda7987e38b1
      - NEXT_PUBLIC_INVESTMENT_ENGINE_ADDRESS=0x69C9739089DbC960e83a51C349cB7B0db69E7A80
      - NEXT_PUBLIC_REFERRAL_REGISTRY_ADDRESS=0x8fb493d566caDE4F24475918277887E85A6506ed
      - NEXT_PUBLIC_REWARD_VAULT_ADDRESS=0x3A49898f23e610894F13F3D65484f557E627557f
      - NEXT_PUBLIC_OSLO_DAO_ADDRESS=0xc90357Fce069af622107ed7CeB3c2029dCE27Bc4
      - NEXT_PUBLIC_LEADERSHIP_BONUS_ADDRESS=0xE05c36e61B81E34d7063627280dE8a9c4CD96e64
      - NEXT_PUBLIC_LEVEL_INCOME_SYSTEM_ADDRESS=0x898095EaBe2C92ad78AbaA1a6ADa7b9346547861
      - NEXT_PUBLIC_REWARD_WALLET=0x1d8896b5A50F720e7ab811dCbfc68b6fE5FcF2b4
      - NEXT_PUBLIC_COMPANY_WALLET=0xBAc7A17Fb7a60751629D19Cf4700730d232D0c56
      - NEXT_PUBLIC_PERF_WALLET=0xf2E281Af319a51066d3428A5Ffda46dAf0f1f5a4
    volumes:
      - oslo_mainnet_v26:/app
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=kairo-dev_kairo_network"
      - "traefik.http.routers.oslomoto-mainnet.rule=Host(`www.oslomoto.com`) || Host(`oslomoto.com`)"
      - "traefik.http.routers.oslomoto-mainnet.entrypoints=websecure"
      - "traefik.http.routers.oslomoto-mainnet.tls=true"
      - "traefik.http.routers.oslomoto-mainnet.tls.certresolver=letsencrypt"
      - "traefik.http.services.oslomoto-mainnet.loadbalancer.server.port=3000"
      - "traefik.http.routers.oslomoto-mainnet.priority=10"

volumes:
  oslo_mainnet_v26:

networks:
  traefik_net:
    external: true
    name: kairo-dev_kairo_network
